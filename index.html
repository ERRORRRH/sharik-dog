<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шарік — Володар солонини</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff3e0;
            color: #3e2723;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #e65100;
            margin-bottom: 10px;
        }
        .subtitle {
            font-style: italic;
            color: #795548;
            margin-bottom: 30px;
        }
        .card {
            background: #ffe0b2;
            padding: 15px;
            margin: 15px 0;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: bold;
        }
        p {
            line-height: 1.6;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Це мій пес Шарік! </h1>
        <div class="subtitle">Гроза району та любитель смаколиків</div>
        
        <p>Він любить їсти, спати і кусати людей.</p>
        
        <div class="card">
             Особлива пристрасть: він дуже любить солонину і м'ясо!
        </div>
        
        <p>Якщо бачите Шаріка — краще поділіться шматочком, інакше він почне кусатися! </p>
    </div>
</body>
</html>
